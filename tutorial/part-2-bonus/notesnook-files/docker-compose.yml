# Notesnook sync server — Raspberry Pi 5 edition
#
# License: this file is adapted from the Notesnook sync server, which is
# licensed under AGPL-3.0 (https://github.com/streetwriters/notesnook-sync-server).
# This file stays under AGPL-3.0; the MIT license of the rest of this
# repository does not apply to it.
#
# Based on the official compose file from
# https://github.com/streetwriters/notesnook-sync-server (master, Nov 2026)
# Changes from the official file:
#   * Notesnook images pinned to a release tag instead of :latest
#   * restart: unless-stopped on every long-running service (survives reboots)
#   * Ports bound to 127.0.0.1 only — Tailscale Serve publishes them over HTTPS
#   * Data stored in folders on the encrypted drive (NOTESNOOK_DATA_DIR) instead of
#     Docker volumes
#   * MongoDB memory capped so it plays nicely on a Pi
#   * "validate" step uses the official multi-arch bash image
#   * Optional extras (themes, cors-proxy, inbox API) removed
#   * "validate" also requires MINIO_ROOT_USER and MINIO_ROOT_PASSWORD
#
# Not pinned (same as upstream): monograph-server and autoheal still use
# :latest, so "docker compose pull" can update those two. Check before pulling.

x-server-discovery: &server-discovery
  NOTESNOOK_SERVER_PORT: 5264
  NOTESNOOK_SERVER_HOST: notesnook-server
  IDENTITY_SERVER_PORT: 8264
  IDENTITY_SERVER_HOST: identity-server
  SSE_SERVER_PORT: 7264
  SSE_SERVER_HOST: sse-server
  SELF_HOSTED: 1
  IDENTITY_SERVER_URL: ${AUTH_SERVER_PUBLIC_URL}
  NOTESNOOK_APP_HOST: ${NOTESNOOK_APP_PUBLIC_URL}

x-env-files: &env-files
  - .env

services:
  validate:
    image: bash:5
    entrypoint: ["bash"]
    env_file: *env-files
    command:
      - -c
      - |
        required_vars=(
          "INSTANCE_NAME"
          "NOTESNOOK_API_SECRET"
          "DISABLE_SIGNUPS"
          "AUTH_SERVER_PUBLIC_URL"
          "NOTESNOOK_APP_PUBLIC_URL"
          "MONOGRAPH_PUBLIC_URL"
          "ATTACHMENTS_SERVER_PUBLIC_URL"
          "NOTESNOOK_API_PUBLIC_URL"
          "MINIO_ROOT_USER"
          "MINIO_ROOT_PASSWORD"
        )
        for var in "$${required_vars[@]}"; do
          if [ -z "$${!var}" ]; then
            echo "Error: Required environment variable $$var is not set."
            exit 1
          fi
        done
        echo "All required environment variables are set."
    restart: "no"

  notesnook-db:
    image: mongo:7.0.12          # do NOT bump to mongo 8.x — 8.0.5+ crash-loops on Pi 5
    hostname: notesnook-db
    restart: unless-stopped
    volumes:
      - ${NOTESNOOK_DATA_DIR:?Set NOTESNOOK_DATA_DIR in .env}/db:/data/db
    networks:
      - notesnook
    command: --replSet rs0 --bind_ip_all --wiredTigerCacheSizeGB 0.5
    depends_on:
      validate:
        condition: service_completed_successfully
    healthcheck:
      test: echo 'try { rs.status() } catch (err) { rs.initiate() }; db.runCommand("ping").ok' | mongosh mongodb://localhost:27017 --quiet
      interval: 40s
      timeout: 30s
      retries: 3
      start_period: 60s

  notesnook-s3:
    image: pgsty/silo:RELEASE.2026-09-16T00-00-00Z
    restart: unless-stopped
    ports:
      - 127.0.0.1:9000:9000
    networks:
      - notesnook
    volumes:
      - ${NOTESNOOK_DATA_DIR}/s3:/data/s3
    environment:
      MINIO_BROWSER: "off"
    depends_on:
      validate:
        condition: service_completed_successfully
    env_file: *env-files
    command: server /data/s3 --console-address :9090
    healthcheck:
      test: ["CMD", "silo", "healthcheck", "ready"]
      interval: 40s
      timeout: 30s
      retries: 3
      start_period: 60s

  # Creates the "attachments" bucket, then exits.
  setup-s3:
    image: pgsty/mc:RELEASE.2026-09-13T00-00-00Z
    depends_on:
      - notesnook-s3
    networks:
      - notesnook
    entrypoint: /bin/bash
    env_file: *env-files
    command:
      - -c
      - |
        until mc alias set silo http://notesnook-s3:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD}; do
          sleep 1;
        done;
        mc mb silo/attachments -p
    restart: "no"

  identity-server:
    image: streetwriters/identity:${NOTESNOOK_VERSION:-v1.0-beta.52}
    restart: unless-stopped
    ports:
      - 127.0.0.1:8264:8264
    networks:
      - notesnook
    env_file: *env-files
    depends_on:
      - notesnook-db
    healthcheck:
      test: wget --tries=1 -nv -q  http://localhost:8264/health -O- || exit 1
      interval: 40s
      timeout: 30s
      retries: 3
      start_period: 60s
    environment:
      <<: *server-discovery
      MONGODB_CONNECTION_STRING: mongodb://notesnook-db:27017/identity?replSet=rs0
      MONGODB_DATABASE_NAME: identity

  notesnook-server:
    image: streetwriters/notesnook-sync:${NOTESNOOK_VERSION:-v1.0-beta.52}
    restart: unless-stopped
    ports:
      - 127.0.0.1:5264:5264
    networks:
      - notesnook
    env_file: *env-files
    depends_on:
      - notesnook-s3
      - setup-s3
      - identity-server
    healthcheck:
      test: wget --tries=1 -nv -q  http://localhost:5264/health -O- || exit 1
      interval: 40s
      timeout: 30s
      retries: 3
      start_period: 60s
    environment:
      <<: *server-discovery
      MONGODB_CONNECTION_STRING: mongodb://notesnook-db:27017/?replSet=rs0
      MONGODB_DATABASE_NAME: notesnook
      S3_INTERNAL_SERVICE_URL: "http://notesnook-s3:9000"
      S3_INTERNAL_BUCKET_NAME: "attachments"
      S3_ACCESS_KEY_ID: "${MINIO_ROOT_USER}"
      S3_ACCESS_KEY: "${MINIO_ROOT_PASSWORD}"
      S3_SERVICE_URL: "${ATTACHMENTS_SERVER_PUBLIC_URL}"
      S3_REGION: "us-east-1"
      S3_BUCKET_NAME: "attachments"

  sse-server:
    image: streetwriters/sse:${NOTESNOOK_VERSION:-v1.0-beta.52}
    restart: unless-stopped
    ports:
      - 127.0.0.1:7264:7264
    env_file: *env-files
    depends_on:
      - identity-server
      - notesnook-server
    networks:
      - notesnook
    healthcheck:
      test: wget --tries=1 -nv -q  http://localhost:7264/health -O- || exit 1
      interval: 40s
      timeout: 30s
      retries: 3
      start_period: 60s
    environment:
      <<: *server-discovery

  # Monograph = publishing notes as web pages. The apps require its URL to be
  # reachable when you connect, so it stays in even if you never publish.
  monograph-server:
    image: streetwriters/monograph:latest
    restart: unless-stopped
    ports:
      - 127.0.0.1:6264:3000
    env_file: *env-files
    depends_on:
      - notesnook-server
    networks:
      - notesnook
    healthcheck:
      test: >
        bun -e "fetch('http://127.0.0.1:3000/api/health')
        .then(r => { if (!r.ok) process.exit(1); })
        .catch(() => process.exit(1))"
      interval: 40s
      timeout: 30s
      retries: 3
      start_period: 60s
    environment:
      <<: *server-discovery
      NODE_ENV: production
      HOST: 0.0.0.0
      API_HOST: ${NOTESNOOK_API_PUBLIC_URL}
      PUBLIC_URL: ${MONOGRAPH_PUBLIC_URL}

  # Restarts any container whose health check keeps failing.
  autoheal:
    image: willfarrell/autoheal:latest
    tty: true
    restart: always
    environment:
      - AUTOHEAL_INTERVAL=60
      - AUTOHEAL_START_PERIOD=300
      - AUTOHEAL_DEFAULT_STOP_TIMEOUT=10
    depends_on:
      validate:
        condition: service_completed_successfully
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

networks:
  notesnook:
